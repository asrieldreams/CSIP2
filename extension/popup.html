<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSIP2 ScamWatch</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 320px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0d1117;
    color: #e6edf3;
  }

  /* ── Header ── */
  .header {
    background: #161b22;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo { font-size: 1.3rem; }
  .logo-text { font-size: 0.92rem; font-weight: 700; color: #e6edf3; }
  .logo-sub  { font-size: 0.68rem; color: #6e7681; }
  .version   { margin-left: auto; font-size: 0.65rem; color: #484f58; }

  /* ── Status section ── */
  .status-section { padding: 14px 16px; }
  .url-text {
    font-size: 0.72rem;
    color: #6e7681;
    font-family: monospace;
    word-break: break-all;
    margin-bottom: 10px;
    padding: 6px 8px;
    background: #1c2128;
    border-radius: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .status-card {
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid transparent;
  }
  .status-card.safe    { background:rgba(63,185,80,0.12);  border-color:rgba(63,185,80,0.25);  }
  .status-card.danger  { background:rgba(248,81,73,0.12);  border-color:rgba(248,81,73,0.25);  }
  .status-card.warning { background:rgba(210,153,34,0.12); border-color:rgba(210,153,34,0.25); }
  .status-card.pending { background:rgba(47,129,247,0.12); border-color:rgba(47,129,247,0.25); }
  .status-card.loading { background:#1c2128; border-color:rgba(255,255,255,0.07); }
  .status-icon { font-size: 1.5rem; flex-shrink: 0; }
  .status-title { font-size: 0.85rem; font-weight: 700; }
  .status-desc  { font-size: 0.72rem; color: #8b949e; margin-top: 2px; }
  .status-card.safe    .status-title { color: #3fb950; }
  .status-card.danger  .status-title { color: #f85149; }
  .status-card.warning .status-title { color: #d29922; }
  .status-card.pending .status-title { color: #2f81f7; }
  .status-card.loading .status-title { color: #6e7681; }

  /* ── Stats row ── */
  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 0 16px 14px;
  }
  .stat-item {
    background: #1c2128;
    border-radius: 8px;
    padding: 10px 12px;
    text-align: center;
  }
  .stat-num   { font-size: 1.3rem; font-weight: 800; color: #f85149; }
  .stat-label { font-size: 0.65rem; color: #6e7681; margin-top: 2px; }

  /* ── Actions ── */
  .actions { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 8px; }
  .btn {
    width: 100%;
    padding: 9px 14px;
    border-radius: 7px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: inherit;
  }
  .btn-report {
    background: #2f81f7;
    color: #fff;
  }
  .btn-report:hover { background: #1a6fd4; }
  .btn-report:disabled { background: #484f58; cursor: not-allowed; }
  .btn-reset {
    background: transparent;
    color: #6e7681;
    border: 1px solid rgba(255,255,255,0.07);
    font-size: 0.75rem;
  }
  .btn-reset:hover { background: #1c2128; color: #e6edf3; }

  /* ── Footer ── */
  .footer {
    border-top: 1px solid rgba(255,255,255,0.07);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .footer-text { font-size: 0.65rem; color: #484f58; }
  .footer-link { font-size: 0.65rem; color: #2f81f7; text-decoration: none; }
  .footer-link:hover { text-decoration: underline; }

  /* ── Spinner ── */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.1);
    border-top-color: #2f81f7;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">🛡️</div>
  <div>
    <div class="logo-text">CSIP2 ScamWatch</div>
    <div class="logo-sub">Community Scam Intelligence</div>
  </div>
  <div class="version">v2.0</div>
</div>

<!-- Status -->
<div class="status-section">
  <div class="url-text" id="current-url">Loading...</div>
  <div class="status-card loading" id="status-card">
    <div class="spinner" id="status-icon"></div>
    <div>
      <div class="status-title" id="status-title">Checking...</div>
      <div class="status-desc"  id="status-desc">Scanning against CSIP2 database</div>
    </div>
  </div>
</div>

<!-- Stats -->
<div class="stats-row">
  <div class="stat-item">
    <div class="stat-num" id="blocked-count">0</div>
    <div class="stat-label">Threats Blocked</div>
  </div>
  <div class="stat-item">
    <div class="stat-num" style="color:#3fb950" id="db-count">—</div>
    <div class="stat-label">DB Reports</div>
  </div>
</div>

<!-- Actions -->
<div class="actions">
  <button class="btn btn-report" id="report-btn">
    📢 Report This Page
  </button>
  <button class="btn btn-reset" id="reset-btn">
    🔄 Reset Threat Counter
  </button>
</div>

<!-- Footer -->
<div class="footer">
  <span class="footer-text">Protected by CSIP2</span>
  <a class="footer-link" href="https://csip2-backend-production.up.railway.app/api/scams" target="_blank">
    View Scam Database →
  </a>
</div>

<script src="popup.js"></script>
</body>
</html>
